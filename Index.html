<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>25th CAB | UH-60M Daily Standardization Quiz</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #eab308;
      --accent-hover: #ca8a04;
      --badge-bg: #334155;
      --answer-bg: #0f172a;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin: auto 0;
    }

    header {
      text-align: center;
      padding-bottom: 4px;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
    }

    header p {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
    }

    select {
      flex: 1;
      min-width: 180px;
      background-color: var(--card);
      color: var(--text);
      border: 1px solid var(--card-border);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      outline: none;
    }

    .counter {
      font-size: 0.82rem;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--card-border);
      padding: 10px 12px;
      border-radius: 10px;
      white-space: nowrap;
    }

    .card {
      background-color: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      background-color: var(--badge-bg);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .q-number {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
    }

    .question-text {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text);
    }

    .answer-box {
      background-color: var(--answer-bg);
      border-left: 4px solid var(--success);
      border-radius: 10px;
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 10px;
      animation: fadeIn 0.2s ease-in-out;
    }

    .answer-box.visible {
      display: flex;
    }

    .answer-label {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--success);
    }

    .answer-text {
      font-size: 1rem;
      color: var(--text);
    }

    .reference-text {
      font-size: 0.82rem;
      color: var(--muted);
      border-top: 1px solid var(--card-border);
      padding-top: 8px;
      font-style: italic;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.08s ease, background-color 0.15s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-reveal {
      background-color: #334155;
      color: var(--text);
    }

    .btn-reveal:hover {
      background-color: #475569;
    }

    .btn-next {
      background-color: var(--accent);
      color: #0f172a;
    }

    .btn-next:hover {
      background-color: var(--accent-hover);
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 8px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>UH-60M Standardization QOTD</h1>
      <p>25th CAB • Wheeler Army Airfield, HI</p>
    </header>

    <div class="controls">
      <select id="categoryFilter" aria-label="Filter by Reference Category">
        <option value="ALL">All Categories (105 Questions)</option>
        <option value="UH-60M">UH-60M Systems & Limits (TM -10)</option>
        <option value="AR 95-1">AR 95-1 Flight Regulations</option>
        <option value="H-60 ATM">H-60 ATM (TC 3-04.33)</option>
        <option value="USAG-HI">USAG-HI Flying Rules</option>
        <option value="25th CAB SOP">25th CAB Tactical SOP</option>
      </select>
      <div class="counter" id="poolCounter">Pool: 105</div>
    </div>

    <main class="card">
      <div class="meta-row">
        <span class="badge" id="qCategory">Loading...</span>
        <span class="q-number" id="qId">#001</span>
      </div>

      <div class="question-text" id="qText">
        Loading random question...
      </div>

      <div class="answer-box" id="answerBox">
        <div class="answer-label">Answer</div>
        <div class="answer-text" id="aText"></div>
        <div class="reference-text" id="rText"></div>
      </div>

      <div class="actions">
        <button class="btn-reveal" id="revealBtn" onclick="toggleAnswer()">Reveal Answer</button>
        <button class="btn-next" onclick="nextRandomQuestion()">Next Random Question ↻</button>
      </div>
    </main>

    <footer>
      TM 1-1520-280-10 (Ch 3) • AR 95-1 • TC 3-04.33 • USAG-HI • 25th CAB SOP
    </footer>
  </div>

  <script>
    const questionBank = [
      // ==================== UH-60M SYSTEMS, AVIONICS & LIMITS (45 Questions) ====================
      {
        id: 1,
        category: "UH-60M",
        q: "On the UH-60M EICAS display, what happens to a parameter's readout and label when an input fails, and what color border surrounds an engine/transmission tape group if one item enters a cautionary range?",
        a: "The label displays as a fail flag (black text on a red background), the readout is replaced by three red dashes, and the tape is removed. The border surrounding the tape group matches the color of the most critical item in that group—yellow for cautionary.",
        ref: "TM 1-1520-280-10, Para 2-29a(2)"
      },
      {
        id: 2,
        category: "UH-60M",
        q: "Under normal UH-60M configuration, which Data Concentrator Unit (DCU) and Embedded GPS/INS (EGI) serve as the primary default data sources for the pilot (MFD 3/4) versus the copilot (MFD 1/2)?",
        a: "The copilot (MFD 1/2) defaults to DCU 1 and EGI 1; the pilot (MFD 3/4) defaults to DCU 2 and EGI 2.",
        ref: "TM 1-1520-280-10, Table 2-4"
      },
      {
        id: 3,
        category: "UH-60M",
        q: "When is Turbine Gas Temperature (TGT) symbology displayed on the Primary Flight Display (PFD) Power Pod?",
        a: "Only under abnormal engine conditions: when either engine TGT exceeds the continuous limit of 793°C (30-minute range), when the difference between TGT1 and TGT2 exceeds 75°C, or when either engine is out.",
        ref: "TM 1-1520-280-10, Para 2-29a(6)(b) & 2-29b(3)"
      },
      {
        id: 4,
        category: "UH-60M",
        q: "On an engine equipped with an Enhanced Digital Engine Control Unit (EDECU), what torque validation code displays on the torque meter upon AC power-up if the Discrete Application Selection (DAS) plug is properly installed for T700-GE-701D limiting values?",
        a: "25% (if it displays 15%, the DAS plug is missing and the 701D engine will operate with 701C limiting values).",
        ref: "TM 1-1520-280-10, Para 2-26b(1) & Figure 2-13"
      },
      {
        id: 5,
        category: "UH-60M",
        q: "Under what three conditions will an EDECU automatically bypass the 10-minute TGT limiter and activate the 2.5-minute contingency power TGT limit (903°C)?",
        a: "When NP drops below 96%, when there is greater than 3% droop between reference NP and actual NP, or when an NP droop rate greater than 5% per second exists while NP is at or below NP reference speed (does not require opposite engine torque < 50%).",
        ref: "TM 1-1520-280-10, Para 2-26b(2)"
      },
      {
        id: 6,
        category: "UH-60M",
        q: "When batteries are the sole source of electrical power in flight on the UH-60M, approximately how long will they power essential DC equipment (excluding searchlight use), and which MFDs remain powered?",
        a: "Approximately 15 minutes. Only the pilot's inboard MFD (#3) is powered by the DC essential bus.",
        ref: "TM 1-1520-280-10, Para 2-61b"
      },
      {
        id: 7,
        category: "UH-60M",
        q: "What are the pitch and bank limits that trigger the UH-60M PFD 'Unusual Attitude' declutter mode, and at what pitch and bank angles is full ADI symbology restored?",
        a: "Unusual attitude declutter triggers at 30° nose up, 20° nose down, or 65° bank (left or right). Full ADI symbology restores once pitch returns between 25° nose up and 15° nose down and bank is less than 60°.",
        ref: "TM 1-1520-280-10, Para 2-72e(4)"
      },
      {
        id: 8,
        category: "UH-60M",
        q: "During UH-60M Required Navigation Performance (RNP) operations, what is the maximum ground speed during a turn due to FMS steering limitations, and what is the maximum rolling steering limit on Radius-to-Fix (RF) legs?",
        a: "132 knots GS maximum during a turn, and a 20° maximum rolling steering limit on RF legs.",
        ref: "TM 1-1520-280-10, Para 2-72e(7)"
      },
      {
        id: 9,
        category: "UH-60M",
        q: "What is the maximum permissible gross weight of the UH-60M helicopter, and what is the maximum cargo hook capacity?",
        a: "Maximum gross weight is 22,000 lbs (23,500 lbs for external load missions only with specific restrictions). The cargo hook has a maximum capacity of 9,000 lbs.",
        ref: "TM 1-1520-280-10, Para 5-7 & 5-17"
      },
      {
        id: 10,
        category: "UH-60M",
        q: "What is the maximum airspeed (VNE) for the UH-60M at sea level up to 3,000 feet PA and ≤20°C FAT, and what is the maximum autorotation airspeed?",
        a: "VNE is 193 KIAS (at or below 16,825 lbs GW, decreasing with higher GW/altitude/temperature). Maximum autorotation airspeed is 150 KIAS.",
        ref: "TM 1-1520-280-10, Para 5-10 & Fig 5-2"
      },
      {
        id: 11,
        category: "UH-60M",
        q: "What are the maximum airspeeds for operating the UH-60M with cabin doors open, and with the cockpit doors removed?",
        a: "Cabin doors full open: 145 KIAS. Cabin doors open in intermediate positions: 100 KIAS. Cockpit doors removed: 130 KIAS.",
        ref: "TM 1-1520-280-10, Para 5-10"
      },
      {
        id: 12,
        category: "UH-60M",
        q: "What are the maximum airspeeds for landing light extension/retraction and searchlight operation on the UH-60M?",
        a: "Landing light extension/retraction: 130 KIAS (fixed/extended limit 180 KIAS). Searchlight extension/retraction/operation: 100 KIAS (stowed 180 KIAS).",
        ref: "TM 1-1520-280-10, Para 5-10"
      },
      {
        id: 13,
        category: "UH-60M",
        q: "What are the maximum allowable sideward and rearward flight airspeeds for the UH-60M?",
        a: "45 KTAS (or KIAS/GS depending on wind conditions; structural/controllability limit is 45 knots).",
        ref: "TM 1-1520-280-10, Para 5-11"
      },
      {
        id: 14,
        category: "UH-60M",
        q: "What are the UH-60M slope landing limitations (nose-up, nose-down, and lateral)?",
        a: "15° nose-up, 6° nose-down, and 15° lateral (upslope/downslope). Note: Reduce lateral limit by 2° for every 5 knots of crosswind.",
        ref: "TM 1-1520-280-10, Para 5-12"
      },
      {
        id: 15,
        category: "UH-60M",
        q: "What are the rotor brake operational limits on the UH-60M regarding rotor RPM and engine operation?",
        a: "Do not apply the rotor brake above 40% NR (36% NR if APU is running for normal stops; up to 40% NR for emergency). Never start engines with the rotor brake engaged except during authorized maintenance checks.",
        ref: "TM 1-1520-280-10, Para 5-9"
      },
      {
        id: 16,
        category: "UH-60M",
        q: "What is the maximum wind velocity for starting or stopping the rotor blades on the UH-60M?",
        a: "45 knots.",
        ref: "TM 1-1520-280-10, Para 5-9"
      },
      {
        id: 17,
        category: "UH-60M",
        q: "What are the T700-GE-701D engine TGT limits for Maximum Continuous (30-min), Intermediate Rated Power (10-min), Contingency Power (2.5-min), and Starting?",
        a: "Continuous (30 min): 793°C; IRP (10 min): 865°C; Contingency (2.5 min): 903°C; Starting: 851°C (abort start if TGT approaches 851°C).",
        ref: "TM 1-1520-280-10, Para 5-5 & Fig 5-1"
      },
      {
        id: 18,
        category: "UH-60M",
        q: "What is the Dual-Engine Maximum Continuous Torque limit on the UH-60M, and what is the 10-second transient torque limit?",
        a: "Dual-engine maximum continuous torque is 100% (up to 80 KIAS) and 120% (above 80 KIAS). Single-engine continuous is 135% (above 80 KIAS) / 110% (at or below 80 KIAS). Transient (10 sec) is 144%.",
        ref: "TM 1-1520-280-10, Para 5-6 & Fig 5-1"
      },
      {
        id: 19,
        category: "UH-60M",
        q: "What are the normal operating, minimum continuous, and maximum transient Main Rotor RPM (NR) limits in power-on and power-off flight?",
        a: "Power-on normal: 95%–101% (100% nominal). Power-off (autorotation) continuous: 90%–105%; transient (5 sec): 85%–110% (max 110%).",
        ref: "TM 1-1520-280-10, Para 5-8 & Fig 5-1"
      },
      {
        id: 20,
        category: "UH-60M",
        q: "What are the starter duty cycle limits for the T700-GE-701D engine?",
        a: "Two consecutive start cycles (up to 60 seconds each) with a 60-second rest period between cycles, followed by a 30-minute cooling period.",
        ref: "TM 1-1520-280-10, Para 5-5"
      },
      {
        id: 21,
        category: "UH-60M",
        q: "What are the APU continuous and 5-minute load/bleed-air limits on the UH-60M, and what is the maximum altitude for APU start and operation?",
        a: "Max altitude for start and operation is 15,000 feet PA (20,000 feet for emergency electrical power only). Continuous operation up to 43°C FAT; above 43°C FAT, limit generator + bleed air load to 5 minutes.",
        ref: "TM 1-1520-280-10, Para 5-5"
      },
      {
        id: 22,
        category: "UH-60M",
        q: "How does the UH-60M Fuel System supply fuel to the engines, and how much usable fuel is held in the two main crashworthy fuel cells?",
        a: "Engine-driven suction fuel boost pumps draw fuel directly from the two main tanks (no submerged electric boost pumps in main cells). Total usable fuel is approximately 360 gallons (approx. 2,340–2,448 lbs depending on fuel density).",
        ref: "TM 1-1520-280-10, Para 2-27"
      },
      {
        id: 23,
        category: "UH-60M",
        q: "At approximately what fuel quantity does the '#1 FUEL LOW' or '#2 FUEL LOW' advisory illuminate on the UH-60M EICAS?",
        a: "When fuel remaining in the respective main tank drops to approximately 172 lbs (roughly 20–30 minutes of flight time remaining per tank).",
        ref: "TM 1-1520-280-10, Para 2-27"
      },
      {
        id: 24,
        category: "UH-60M",
        q: "Describe the UH-60M hydraulic system architecture—how many hydraulic pumps are installed, where are they mounted, and what does the Backup Hydraulic Pump do?",
        a: "Three hydraulic pumps: #1 and #2 pumps are driven by the left and right accessory modules on the main transmission. The #3 Backup Pump is electric (AC-powered via the APU or main generators) and automatically activates if #1 or #2 hydraulic pressure drops or during tail rotor servo 1st/2nd stage failures.",
        ref: "TM 1-1520-280-10, Para 2-32"
      },
      {
        id: 25,
        category: "UH-60M",
        q: "What happens if both primary hydraulic systems (#1 and #2) fail in flight on the UH-60M?",
        a: "The Backup Hydraulic Pump automatically turns on to power the #1 primary flight control servos and the #2 tail rotor servo, restoring hydraulic assist to all flight controls.",
        ref: "TM 1-1520-280-10, Para 2-32"
      },
      {
        id: 26,
        category: "UH-60M",
        q: "In the UH-60M Flight Control System, what is the purpose of the Digital Automatic Flight Control System (DAFCS) Stabilator control, and at what airspeed does the stabilator begin programming down from its full-up (38°–40°) hover position?",
        a: "The stabilator automatically programs trailing-edge down to minimize pitch attitude changes with airspeed, collective, and pitch rate. It remains full trailing-edge down below ~30–40 KIAS to prevent main rotor downwash from pitching the nose up, and begins streamlining upward above ~40 KIAS.",
        ref: "TM 1-1520-280-10, Para 2-36"
      },
      {
        id: 27,
        category: "UH-60M",
        q: "If the automatic stabilator mode fails in flight and the pilot must fly with a fixed stabilator position, what is the maximum airspeed limitation if the stabilator cannot be slewed from 0°?",
        a: "Refer to the Stabilator Failure Airspeed Limit chart (at 0° fixed, VNE is typically 150 KIAS; if stuck full down at 39°, airspeed is restricted to 80 KIAS).",
        ref: "TM 1-1520-280-10, Para 5-10 & 9-12"
      },
      {
        id: 28,
        category: "UH-60M",
        q: "What are the four sub-modes of the UH-60M Stability Augmentation System (SAS) and Flight Path Stabilization (FPS)?",
        a: "SAS 1 (digital, inner-loop rate damping), SAS 2 (digital, inner-loop rate damping), Trim (force-feel/gradient), and FPS (outer-loop attitude, heading, airspeed, and altitude hold).",
        ref: "TM 1-1520-280-10, Para 2-35"
      },
      {
        id: 29,
        category: "UH-60M",
        q: "What is the authority limit of the SAS actuators in the UH-60M flight control system?",
        a: "±10% of total control travel (5% per SAS channel).",
        ref: "TM 1-1520-280-10, Para 2-35"
      },
      {
        id: 30,
        category: "UH-60M",
        q: "What are the emergency procedure immediate action steps for an ENGINE FIRE IN FLIGHT on the UH-60M?",
        a: "1. POWER CONTROL LEVER (affected engine) — OFF. 2. ENGINE FUEL SYSTEM SELECTOR (affected engine) — OFF. 3. FIRE EXTGH switch — MAIN (or RESERVE if needed).",
        ref: "TM 1-1520-280-10, Para 9-5"
      },
      {
        id: 31,
        category: "UH-60M",
        q: "What are the immediate action steps for a DUAL-ENGINE FAILURE IN FLIGHT (autorotation) on the UH-60M?",
        a: "1. Collective — Adjust to maintain NR between 90% and 105%. 2. Airspeed — Adjust as required (80 KIAS for maximum glide distance; 65 KIAS for minimum rate of descent). 3. Flare and cushion landing.",
        ref: "TM 1-1520-280-10, Para 9-4"
      },
      {
        id: 32,
        category: "UH-60M",
        q: "What are the immediate action steps for an ENGINE COMPRESSOR STALL on the UH-60M?",
        a: "1. Collective — Reduce to lower power demand on affected engine. 2. Engine anti-ice — ON (if icing conditions exist). 3. Affected PCL — Retard slightly to determine if stall clears; if TGT exceeds limits or stall persists, shut down affected engine.",
        ref: "TM 1-1520-280-10, Para 9-4"
      },
      {
        id: 33,
        category: "UH-60M",
        q: "What are the immediate action steps for a LOSS OF TAIL ROTOR THRUST (Fixed Pitch / Control Failure) in flight on the UH-60M?",
        a: "If power-on controllability cannot be maintained: 1. Maintain airspeed above 40–60 KIAS (minimum drag/weathercock stability). 2. Reduce PCLs to IDLE/OFF prior to touchdown and perform a shallow autorotative/running landing.",
        ref: "TM 1-1520-280-10, Para 9-9"
      },
      {
        id: 34,
        category: "UH-60M",
        q: "When a '#1 MAIN XMSN OIL PRESS' or '#2 MAIN XMSN OIL PRESS' caution appears accompanied by low main transmission oil pressure (< 20 psi) or high oil temperature (> 120°C), what is the required emergency action?",
        a: "LAND IMMEDIATELY.",
        ref: "TM 1-1520-280-10, Para 9-7"
      },
      {
        id: 35,
        category: "UH-60M",
        q: "Define the three emergency landing terms used in the UH-60M Operator's Manual: 'Land Immediately', 'Land as Soon as Possible', and 'Land as Soon as Practicable'.",
        a: "Land Immediately: Land without delay at the nearest safe area (even if hazardous). Land as Soon as Possible: Land at the nearest suitable landing area without delay. Land as Soon as Practicable: Extended flight is not recommended; landing site and duration are at pilot discretion.",
        ref: "TM 1-1520-280-10, Para 9-1"
      },
      {
        id: 36,
        category: "UH-60M",
        q: "What is the purpose of the UH-60M Gust Lock, and what interlock prevents flying with it engaged?",
        a: "The gust lock secures the main rotor hub and blades against wind gusts up to 60 knots when parked. Mechanical interlocks prevent the engine Power Control Levers from advancing out of OFF while the gust lock is engaged.",
        ref: "TM 1-1520-280-10, Para 2-12"
      },
      {
        id: 37,
        category: "UH-60M",
        q: "How many main rotor blades and tail rotor blades does the UH-60M have, and what is the tail rotor cant angle?",
        a: "Four wide-chord main rotor blades (with swept tips) and four tail rotor blades (two composite cross-beam paddles canted 20° upward to provide 2.5% of total vertical lift).",
        ref: "TM 1-1520-280-10, Para 2-11 & 2-14"
      },
      {
        id: 38,
        category: "UH-60M",
        q: "What is the minimum rotor tip clearance from the ground on a level surface with the UH-60M at normal static weight?",
        a: "Approximately 10 feet 6 inches (with rotor stationary; droop stops keep blades from striking the fuselage during shutdown).",
        ref: "TM 1-1520-280-10, Fig 1-2"
      },
      {
        id: 39,
        category: "UH-60M",
        q: "What is the UH-60M's electrical power generation configuration under normal flight conditions?",
        a: "Two 30/45 kVA oil-cooled AC generators driven by the main transmission accessory modules, plus one 20/30 kVA APU AC generator. Two Transformer Rectifier Units (TRUs) convert 115V AC to 28V DC, backed up by two 24V NiCad batteries.",
        ref: "TM 1-1520-280-10, Para 2-58"
      },
      {
        id: 40,
        category: "UH-60M",
        q: "On the UH-60M, how does the Ice Detection System notify the crew of icing conditions, and what is the maximum icing intensity the helicopter is certified to penetrate?",
        a: "The ice detector probe illuminates 'ICING' on the EICAS and displays Liquid Water Content (LWC) in g/m³. The UH-60M is certified for flight into Trace and Light icing (and Moderate icing for up to 15 minutes with blade de-ice operational).",
        ref: "TM 1-1520-280-10, Para 2-46 & 5-13"
      },
      {
        id: 41,
        category: "UH-60M",
        q: "What is the minimum crew required to operate the UH-60M in flight, and what are their required stations?",
        a: "Two pilots (Pilot and Copilot) at the flight controls, plus at least one Crew Chief/non-rated crewmember in the cabin for tactical/passenger/sling operations as required by mission/SOP.",
        ref: "TM 1-1520-280-10, Para 5-3"
      },
      {
        id: 42,

        q: "Per the 25th CAB SOP, what actions must the crew take immediately upon experiencing an uncommanded flight control movement, caution/warning light, or bird strike?",
        a: "Maintain aircraft control, execute the appropriate TM -10 emergency procedure, notify Flight Lead/ATC, land as soon as practicable/possible, and submit a Hazard/Incident Report to Battalion Safety upon landing.",
        ref: "25th CAB SOP, Ch 1"
      },
      {
        id: 105,
        category: "25th CAB SOP",
        q: "What is the 25th CAB SOP 'Knock-It-Off' policy during training exercises?",
        a: "Any crewmember, ground controller, or observer may call 'KNOCK IT OFF' over the radio or ICS whenever an unsafe condition, loss of situational awareness, or airspace/terrain conflict is observed. All aircraft immediately cease tactical maneuvering, climb to safe altitude, and establish positive separation.",
        ref: "25th CAB SOP, Ch 1"
      }
    ];

    let currentPool = [...questionBank];
    let lastQuestionId = null;

    const categoryFilter = document.getElementById("categoryFilter");
    const poolCounter = document.getElementById("poolCounter");
    const qCategory = document.getElementById("qCategory");
    const qId = document.getElementById("qId");
    const qText = document.getElementById("qText");
    const answerBox = document.getElementById("answerBox");
    const aText = document.getElementById("aText");
    const rText = document.getElementById("rText");
    const revealBtn = document.getElementById("revealBtn");

    function updatePool() {
      const selected = categoryFilter.value;
      if (selected === "ALL") {
        currentPool = [...questionBank];
      } else {
        currentPool = questionBank.filter(item => item.category === selected);
      }
      poolCounter.textContent = `Pool: ${currentPool.length}`;
      nextRandomQuestion();
    }

    function nextRandomQuestion() {
      if (currentPool.length === 0) return;

      let candidate;
      if (currentPool.length === 1) {
        candidate = currentPool[0];
      } else {
        do {
          const randomIndex = Math.floor(Math.random() * currentPool.length);
          candidate = currentPool[randomIndex];
        } while (candidate.id === lastQuestionId);
      }

      lastQuestionId = candidate.id;

      // Reset answer visibility
      answerBox.classList.remove("visible");
      revealBtn.textContent = "Reveal Answer";

      // Populate card
      qCategory.textContent = candidate.category;
      qId.textContent = `#${String(candidate.id).padStart(3, "0")} of ${questionBank.length}`;
      qText.textContent = candidate.q;
      aText.textContent = candidate.a;
      rText.textContent = `Reference: ${candidate.ref}`;
    }

    function toggleAnswer() {
      const isVisible = answerBox.classList.toggle("visible");
      revealBtn.textContent = isVisible ? "Hide Answer" : "Reveal Answer";
    }

    categoryFilter.addEventListener("change", updatePool);

    // Load a random question immediately when the QR code opens the page
    window.addEventListener("DOMContentLoaded", () => {
      nextRandomQuestion();
    });
  </script>
</body>
</html>
